.st{display:flex;justify-content:space-between;font-size:1.9vh;padding:.6vh 0;border-top:1px solid #33467a}.st b{font-size:2vh}.pl .st{font-size:16px;padding:10px 0}.st.ok b{color:#7fd1a8}.st.no b{color:#f08a8a}
.tb{font-size:1.7vh!important;margin-top:1.2vh!important}.tb.ok{color:#7fd1a8}.tb.no{color:#f08a8a}.rv1{margin-top:3vh;max-width:60vw}.rv1 h3{color:var(--gold);font-size:2.2vh}
.dt{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}.dt td{padding:5px 4px;border-bottom:1px solid #33467a}.dt td+td{text-align:right}.dt tr.b td{font-weight:700;color:var(--gold)}
.dd{background:#22335f;border-radius:12px;padding:10px 12px;margin:10px 0}.dd summary{font-weight:700;cursor:pointer}.fm{font-size:13px!important;color:#C8D7EE}
.pl #calc{width:100%;font:inherit;font-size:20px;padding:14px;border-radius:10px;border:0;box-sizing:border-box}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.two .chip{margin:0;text-align:center}.kick a{color:var(--gold)}
.pickb{cursor:pointer;color:#fff;font:inherit;text-align:left;border:2px solid transparent}.pickb.on{border-color:var(--gold);background:#3a5190}.big:disabled{opacity:.4}
.tn{font:inherit;font-size:2.4vh;padding:1.4vh;border-radius:1vh;border:0;width:60vw;margin:2vh 0}.top a{color:var(--gold)}</style></head><body><div id="app"></div>
<script>window.QUIZSETS = {

        { id: 'verschub', t: 'Vertrieb, 14.10.: Ein Kunde hat 80 Stück von Oktober auf November verschoben' },

</script><script>// Offline-Fassung ohne Server: Beamer-Modus, Antworten per Zuruf, Handzeichen oder Farbkarte.
const SET = window.QUIZSETS.wahl, WK = SET.work, LIMIT = SET.seconds;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const app = document.getElementById('app');
function fx(kind, ms) {
  const cv = document.createElement('canvas'); cv.className = 'fx';
  document.body.appendChild(cv); const c = cv.getContext('2d');
  const W = cv.width = innerWidth * devicePixelRatio, H = cv.height = innerHeight * devicePixelRatio;
  const cols = ['#C9A86A', '#F4D58D', '#7fd1a8', '#ffffff', '#C8D7EE', '#e9b04f'];
  const P = []; const t0 = performance.now(); let lastBurst = 0;
  const burst = (x, y, n, sp) => { for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, v = (0.4 + Math.random()) * sp; P.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, l: 1, col: cols[i % cols.length], r: (1.5 + Math.random() * 2.5) * devicePixelRatio, k: 'f' }); } };
  const confetti = n => { for (let i = 0; i < n; i++) P.push({ x: Math.random() * W, y: -Math.random() * H * 0.3, vx: (Math.random() - 0.5) * 3, vy: 2 + Math.random() * 4, l: 1, col: cols[i % cols.length], r: (4 + Math.random() * 5) * devicePixelRatio, k: 'c', rot: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3 }); };
  if (kind === 'confetti') confetti(160);
  (function frame(now) {
    const el = now - t0; c.clearRect(0, 0, W, H);
    if (kind === 'fireworks' && el < ms - 800 && now - lastBurst > 380) { lastBurst = now; burst(W * (0.15 + Math.random() * 0.7), H * (0.15 + Math.random() * 0.4), 90, 7 * devicePixelRatio); }
    P.forEach(p => {
      if (p.k === 'f') { p.vx *= 0.985; p.vy = p.vy * 0.985 + 0.08 * devicePixelRatio; p.l -= 0.012; }
      else { p.vy += 0.04; p.rot += p.vr; if (el > ms - 900) p.l -= 0.03; }
      p.x += p.vx; p.y += p.vy; if (p.l <= 0) return;
      c.globalAlpha = Math.max(0, p.l); c.fillStyle = p.col;
      if (p.k === 'f') { c.beginPath(); c.arc(p.x, p.y, p.r, 0, 6.283); c.fill(); }
      else { c.save(); c.translate(p.x, p.y); c.rotate(p.rot); c.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); c.restore(); }
    });
    if (el < ms) requestAnimationFrame(frame); else cv.remove();
  })(t0);
}
function simulate(ids) {
  const has = k => ids.indexOf(k) >= 0, out = [], errs = [];
  if (!has('daten')) {
    out.push({ t: 'Ohne Zahlen kann ich nur allgemein antworten: Typische Ursachen sind Absatzrückgang, Preisdruck und gestiegene Materialkosten.', bad: true });
    errs.push('keine Daten, also nur typische Ursachen');
  } else {
    out.push({ t: 'Der Deckungsbeitrag der Produktlinie Getriebe lag im Oktober mit 297.000 EUR um 103.000 EUR unter Plan.' });
    if (has('rechnung')) out.push({ t: 'Zerlegung: Preis minus 45.000 EUR, Menge minus 40.000 EUR, Kosten minus 18.000 EUR, zusammen minus 103.000 EUR.' });
    else { out.push({ t: 'Hauptursache ist der Absatzrückgang, der den Großteil der Abweichung erklärt.', bad: true }); errs.push('Gewichtung ohne Rechnung'); }
    if (has('quelle')) {
      out.push({ t: 'Ursachen laut Hinweisen: Rabattaktion Ersatzgetriebe (Vertrieb, 20.10.), Verschiebung von 80 Stück auf November (Vertrieb, 14.10.), Überstunden in der Montage (Einkauf, 30.10.).' });
      out.push({ t: 'Offen: Wie lange dauern die Krankheitsausfälle?' });
    } else { out.push({ t: 'Zusätzlich belasten gestiegene Stahlpreise die variablen Kosten.', bad: true }); errs.push('Ursache ohne Quelle'); }
  }
  if (has('prognose')) {
    if (has('quelle') && has('daten')) out.push({ t: 'Eine Anpassung der Jahresprognose lässt sich aus den Hinweisen nicht belegen und bleibt offen.' });
    else { out.push({ t: 'Da der Absatz rückläufig ist, empfehlen wir, die Jahresprognose um 10 Prozent zu senken.', bad: true }); errs.push('erfundener Trend'); }
  }
  if (has('ueberzeugend')) { out.push({ t: 'Insgesamt ist die Lage klar beherrschbar, wir sind auf einem guten Weg.', bad: true }); errs.push('glatter Satz ohne Beleg'); }
  if (has('kurz') && out.length > 3) { out.splice(3); }
  return { out, errs };
}

function scoreTeam(ids) { const W = {}; SET.bricks.forEach(b => W[b.id] = b.w); return Math.max(0, ids.reduce((s, k) => s + (W[k] || 0), 0)); }
let view = 'start', timer = null, teams = [], cur = 0, pick = [], wRevealed = false;
function clock(sec, id, done) {
  clearInterval(timer); let left = sec; const el = () => document.getElementById(id);
  const show = () => { const e = el(); if (e) e.textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0'); };
  show(); timer = setInterval(() => { left--; show(); if (left <= 0) { clearInterval(timer); const e = el(); if (e) e.textContent = 'Zeit!'; if (done) done(); } }, 1000);
}
function render() {
  clearInterval(timer);
  if (view === 'start') {
    app.innerHTML = `<div class="host"><div class="kick">Offline-Fassung · ohne Internet</div><h1>${esc(SET.title)}</h1>
    <p class="sub">Für den Fall, dass das Netz im Hörsaal nicht trägt. Läuft auf dem Laptop am Beamer, die Studierenden antworten per Zuruf und Farbkarte.</p>
    <button class="big" id="w">Runde 1: Prüfwerkstatt</button> <button class="big" id="d">Runde 2: Auftrags-Duell der Reihen</button>
    <p class="note">Entwurf, Dr. Christian Neusser. Die KI-Antworten sind regelbasiert simuliert: gleiche Bausteine, gleiche Antwort.</p></div>`;
    document.getElementById('w').onclick = () => { view = 'work'; wRevealed = false; render(); };
    document.getElementById('d').onclick = () => { view = 'setup'; render(); }; return;
  }
  if (view === 'work') {
    app.innerHTML = `<div class="host q"><div class="top"><span>Runde 1 · Prüfwerkstatt</span><span id="clock">3:00</span><span><a href="#" id="home">Übersicht</a></span></div>
    <div class="hq">Allein: Mengenabweichung rechnen (Arbeitsblatt). Zu zweit: Hält Ihre Aussage den Daten stand? Beleg notieren.</div>
    <div class="wk3">${WK.aussagen.map(x => `<div class="wkc"><div class="kick">${esc(x.reihe)} · Aussage ${x.id}</div><p>${esc(x.t)}</p>
    ${wRevealed ? `<div class="st ok"><span>Mengenabweichung</span><b>minus 40.000 EUR</b></div><div class="st no"><span>Urteil</span><b>hält nicht stand</b></div><p class="tb ok">Beleg: ${esc(x.beleg.map(id => WK.belege.find(b => b.id === id).t).join(' oder '))}</p>` : ''}</div>`).join('')}</div>
    <button class="big" id="go">${wRevealed ? 'Weiter zum Auftrags-Duell' : 'Auflösen'}</button>
    <div class="keys">Zuerst Farbkarten je Reihe: grün hält stand, rot hält nicht. Dann auflösen.</div></div>`;
    document.getElementById('home').onclick = e => { e.preventDefault(); view = 'start'; render(); };
    document.getElementById('go').onclick = () => { if (!wRevealed) { wRevealed = true; render(); fx('confetti', 2500); } else { view = 'setup'; render(); } };
    if (!wRevealed) clock(WK.seconds, 'clock'); return;
  }
  if (view === 'setup') {
    app.innerHTML = `<div class="host"><div class="kick">Runde 2 · Auftrags-Duell der Reihen</div><h1>Welche Reihen treten an?</h1>
    <p class="sub">Jede Reihe einigt sich in 60 Sekunden auf höchstens vier Bausteine und ruft sie zu. Sie klicken mit, die simulierte KI antwortet.</p>
    <input class="tn" id="tn" value="Reihe 1, Reihe 2, Reihe 3"><br><button class="big" id="go">Start: alle Reihen 60 Sekunden</button></div>`;
    document.getElementById('go').onclick = () => { teams = document.getElementById('tn').value.split(',').map(s => s.trim()).filter(Boolean).slice(0, 6).map(n => ({ n, ids: [], pts: 0, done: false })); cur = 0; pick = []; view = 'think'; render(); }; return;
  }
  if (view === 'think') {
    app.innerHTML = `<div class="host q"><div class="top"><span>Bauen Sie den Auftrag, alle Reihen gleichzeitig</span><span id="clock">1:00</span><span>${teams.length} Reihen</span></div>
    <div class="hq">${esc(SET.task)}</div><div class="bricks">${SET.bricks.map(b => `<div class="brick">${esc(b.t)}</div>`).join('')}</div>
    <button class="big" id="go">Aufträge einsammeln</button></div>`;
    document.getElementById('go').onclick = () => { view = 'enter'; render(); };
    clock(LIMIT, 'clock'); return;
  }
  if (view === 'enter') {
    const t = teams[cur];
    app.innerHTML = `<div class="host q"><div class="top"><span>Auftrag von ${esc(t.n)}</span><span>${pick.length} von ${SET.maxPick}</span><span>${cur + 1} von ${teams.length}</span></div>
    <div class="bricks">${SET.bricks.map(b => `<button class="brick pickb ${pick.indexOf(b.id) >= 0 ? 'on' : ''}" data-id="${b.id}">${esc(b.t)}</button>`).join('')}</div>
    <button class="big" id="go" ${pick.length ? '' : 'disabled'}>An die KI senden</button></div>`;
    app.querySelectorAll('.pickb').forEach(c => c.onclick = () => { const id = c.dataset.id, i = pick.indexOf(id); if (i >= 0) pick.splice(i, 1); else if (pick.length < SET.maxPick) pick.push(id); render(); });
    document.getElementById('go').onclick = () => { t.ids = pick.slice(); t.pts = scoreTeam(t.ids); t.done = true; view = 'answer'; render(); if (t.pts > 0) fx('confetti', 2200); }; return;
  }
  if (view === 'answer') {
    const t = teams[cur], r = simulate(t.ids), last = cur === teams.length - 1;
    app.innerHTML = `<div class="host q"><div class="top"><span>${esc(t.n)}</span><span>${t.pts} Punkte</span><span>${r.errs.length ? r.errs.length + ' Fehler im KI-Text' : 'ohne Fehler'}</span></div>
    <div class="rv"><div><h3>Gewählte Bausteine</h3>${t.ids.map(id => { const b = SET.bricks.find(x => x.id === id); return `<div class="bar ${b.w > 0 ? 'gd' : 'bd'}"><span>${esc(b.t)}</span><i style="width:100%"></i><b>${b.w > 0 ? '+' : ''}${b.w}</b></div>`; }).join('')}</div>
    <div><h3>Simulierte KI-Antwort</h3><div class="sim">${r.out.map(s => `<p class="${s.bad ? 'bad' : 'okl'}">${esc(s.t)}</p>`).join('')}</div>
    ${r.errs.length ? `<p class="note">Fehler: ${esc(r.errs.join(', '))}</p>` : ''}</div></div>
    <button class="big" id="go">${last ? 'Siegerehrung' : 'Nächste Reihe'}</button></div>`;
    document.getElementById('go').onclick = () => { if (last) view = 'end'; else { cur++; pick = []; view = 'enter'; } render(); }; return;
  }
  const b = teams.slice().sort((x, y) => y.pts - x.pts);
  app.innerHTML = `<div class="host end"><div class="kick">Auftrags-Duell der Reihen</div><h1>${b[0] ? esc(b[0].n) + ' gewinnt' : 'Ende'}</h1>
  <div class="podium">${[1, 0, 2].map(i => b[i] ? `<div class="p p${i + 1}"><span>${esc(b[i].n)}</span><b>${b[i].pts}</b><i>${i + 1}</i></div>` : '').join('')}</div>
  <button class="ghost" id="rs">Zur Übersicht</button></div>`;
  document.getElementById('rs').onclick = () => { view = 'start'; render(); };
  if (b[0]) { fx('fireworks', 6000); setTimeout(() => fx('confetti', 5000), 600); }
}
render();
</script></body></html>
