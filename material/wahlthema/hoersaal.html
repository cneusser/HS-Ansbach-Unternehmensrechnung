<title>Hörsaal-Quiz KI prüfen</title><style>html,body{margin:0;height:100%;background:#1A2C5A;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}

</style></head><body><div id="stage"></div>
<script src="../assets/quiz.js"></script><script>Hoersaal({"seconds": 20, "questions": [{"q": "Der KI-Kommentar nennt „gestiegene Stahlpreise“. Wie prüfen Sie das?", "o": ["Nachrechnen", "Quelle verlangen, etwa beim Einkauf", "Gar nicht, klingt plausibel"], "a": 1, "why": "Eine Ursache ist eine Behauptung über die Welt. Sie wird belegt, nicht gerechnet."}, {"q": "Zweiter Lauf, gleicher Auftrag, gleiche Daten: andere Ursache. Was folgt?", "o": ["Modell defekt, nie wieder nutzen", "Nicht reproduzierbar: Ursache gilt als offen, bis sie belegt ist", "Den besseren Lauf nehmen"], "a": 1, "why": "Eine Ursache, die zwischen Läufen wechselt, ist nicht belegt. Den besseren Lauf zu wählen wäre Auswahl nach Gefallen."}, {"q": "Welcher Auftrag ist der beste?", "o": ["„Schreib einen Kommentar zum Bericht.“", "„Zerlege nach Menge, Preis, Kosten, zeige die Rechnung, Ursache nur mit Quelle.“", "„Schreib professionell und überzeugend.“"], "a": 1, "why": "Rolle, Daten und zwei Regeln. Der dritte Auftrag erzeugt genau den glatten Text, den wir heute geprüft haben."}, {"q": "Die KI markiert eine Ursache als „offen“. Wie bewerten Sie das?", "o": ["Schwäche des Modells", "Qualitätsmerkmal: es zeigt, wo Sie nachfragen müssen", "Fehler im Auftrag"], "a": 1, "why": "Eine benannte Lücke ist mehr wert als eine erfundene Ursache."}, {"q": "Wo bleibt der Mensch auf jeden Fall in der Schleife?", "o": ["Formatierung", "Ursachen und Empfehlung", "Tabellenaufbau"], "a": 1, "why": "Ursachen und Empfehlungen wandern in Entscheidungen über Einkauf, Personal und Prognose."}]});</script></body></html>
