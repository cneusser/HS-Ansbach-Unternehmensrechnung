<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blitzquiz Rückstellungen offline</title><style>html,body{margin:0;height:100%;background:#1A2C5A;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#stage{height:100%;display:flex;flex-direction:column;padding:4vh 5vw;box-sizing:border-box;cursor:pointer;user-select:none}
.top{display:flex;justify-content:space-between;font-size:2.2vh;color:#C9A86A;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.clock{font-size:4vh;color:#fff}
.hq{font-size:4.6vh;line-height:1.3;font-weight:700;margin:4vh 0 4vh}
.ans{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2vw;flex:0 0 auto}
.a{border-radius:1.6vh;padding:3vh 2vw;font-size:3vh;line-height:1.3;transition:opacity .3s,transform .3s}
.a b{display:block;font-size:2vh;letter-spacing:.12em;text-transform:uppercase;opacity:.85;margin-bottom:1vh}
.a.g{background:#1F6B4F}.a.y{background:#B8892B}.a.r{background:#9B2F2F}
.a.dim{opacity:.22}.a.win{transform:scale(1.04);box-shadow:0 0 0 .6vh #fff}
.hwhy{margin-top:4vh;font-size:2.8vh;line-height:1.45;color:#C8D7EE;opacity:0;transition:opacity .4s}.hwhy.on{opacity:1}
.keys{margin-top:auto;font-size:1.6vh;color:#8793A8}
</style></head><body><div id="stage"></div>
<script src="../assets/quiz.js"></script><script>Hoersaal({"seconds": 15, "questions": [{"q": "Ziel 1: Für eine Werbekampagne im März 2027 sollen 50.000 EUR zurückgestellt werden. Rückstellung zum 31.12.2026?", "o": ["Ja, Pflicht", "Wahlrecht", "Nein, Verbot"], "a": 2, "why": "Keine Verpflichtung gegenüber Dritten, kein Katalogfall: § 249 Abs. 2 Satz 1 HGB."}, {"q": "Ziel 1: Die GmbH bürgt für einen Partner, der seit Jahren pünktlich zahlt. Wie erscheint das im Abschluss?", "o": ["Rückstellung", "Haftungsverhältnis", "Verbindlichkeit"], "a": 1, "why": "Inanspruchnahme unwahrscheinlich, also keine Rückstellung, aber Angabe unter der Bilanz oder im Anhang: §§ 251, 268 Abs. 7 HGB."}, {"q": "Ziel 2: Die 2026 unterlassene Dachreparatur wird am 20. März 2027 nachgeholt. Rückstellung?", "o": ["Ja, Pflicht", "Wahlrecht", "Nein, Verbot"], "a": 0, "why": "Unterlassene Instandhaltung, nachgeholt in den ersten drei Monaten: § 249 Abs. 1 Satz 2 Nr. 1 HGB. Im Juli wäre sie verboten."}, {"q": "Ziel 3: Die Nachbesserung kostet laut Kalkulation 80.000 EUR und wird im Mai 2027 erledigt. Mit welchem Betrag bewerten Sie?", "o": ["80.000 EUR", "erst bei Zahlung", "abgezinst, rund 78.400 EUR"], "a": 0, "why": "Erfüllungsbetrag nach vernünftiger kaufmännischer Beurteilung; Restlaufzeit unter einem Jahr, also keine Abzinsung (§ 253 HGB)."}, {"q": "Ziel 3: Buchungssatz bei Bildung der Gewährleistungsrückstellung am 31.12.2026?", "o": ["Rückstellung an Bank", "Aufwand an Rückstellung", "Rückstellung an Ertrag"], "a": 1, "why": "Bei Bildung fließt kein Geld. Der Aufwand trifft 2026, die Gegenbuchung ist die Rückstellung."}]});</script></body></html>
