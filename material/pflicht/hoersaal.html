<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hörsaal-Quiz Rückstellungen</title><style>html,body{margin:0;height:100%;background:#1A2C5A;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#stage{height:100%;display:flex;flex-direction:column;padding:4vh 5vw;box-sizing:border-box;cursor:pointer;user-select:none}
.top{display:flex;justify-content:space-between;font-size:2.2vh;color:#C9A86A;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.clock{font-size:4vh;color:#fff}
.hq{font-size:4.6vh;line-height:1.3;font-weight:700;margin:4vh 0 4vh}
.ans{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2vw;flex:0 0 auto}
.a{border-radius:1.6vh;padding:3vh 2vw;font-size:3vh;line-height:1.3;transition:opacity .3s,transform .3s}
.a b{display:block;font-size:2vh;letter-spacing:.12em;text-transform:uppercase;opacity:.85;margin-bottom:1vh}
.a.g{background:#1F6B4F}.a.y{background:#B8892B}.a.r{background:#9B2F2F}
.a.dim{opacity:.22}.a.win{transform:scale(1.04);box-shadow:0 0 0 .6vh #fff}
.hwhy{margin-top:4vh;font-size:2.8vh;line-height:1.45;color:#C8D7EE;opacity:0;transition:opacity .4s}.hwhy.on{opacity:1}
.keys{margin-top:auto;font-size:1.6vh;color:#8793A8}
</style></head><body><div id="stage"></div>
<script src="../assets/quiz.js"></script><script>Hoersaal({"seconds": 20, "questions": [{"q": "Wartung der Presse, geplant für Juli 2027, 30.000 EUR. Rückstellung zum 31.12.2026?", "o": ["Ja, Pflicht", "Wahlrecht", "Nein, Verbot"], "a": 2, "why": "Nachholung erst nach drei Monaten: § 249 Abs. 2 Satz 1 HGB. Die KI-Antwort aus der Hausaufgabe ist damit widerlegt."}, {"q": "Prüfung des Abschlusses 2026 im April 2027, Honorar 28.000 EUR. Rückstellung?", "o": ["Ja, ungewisse Verbindlichkeit", "Nein, Aufwand 2027", "Nein, nur Angabe"], "a": 0, "why": "Die Pflicht zur Prüfung (§ 316 HGB) betrifft den Abschluss 2026. Die Kosten sind 2026 verursacht, die Höhe ist noch nicht abgerechnet."}, {"q": "400 Tage Resturlaub aus 2026, 260 EUR je Tag. Wie viel?", "o": ["Keine Rückstellung", "104.000 EUR", "52.000 EUR"], "a": 1, "why": "Die Arbeitsleistung wurde 2026 erbracht, der Urlaub ist noch geschuldet: 400 mal 260 EUR."}, {"q": "Bürgschaft für einen pünktlich zahlenden Partner. Was zeigt der Abschluss?", "o": ["Rückstellung", "Haftungsverhältnis", "Nichts"], "a": 1, "why": "Inanspruchnahme unwahrscheinlich, die Haftung wird aber angegeben: §§ 251, 268 Abs. 7 HGB."}, {"q": "Im Februar 2027, vor der Aufstellung: Die Nachbesserung kostet 95.000 statt 80.000 EUR. Welcher Betrag?", "o": ["80.000 EUR", "95.000 EUR", "87.500 EUR"], "a": 1, "why": "Wertaufhellung: Die Reklamation bestand am Stichtag, die Information bis zur Aufstellung zählt."}]});</script></body></html>
